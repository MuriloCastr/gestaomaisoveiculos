```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinancePro</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  padding:20px;
}

.container{
  max-width:1500px;
  margin:auto;
}

.topo{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  padding:30px;
  border-radius:24px;
  margin-bottom:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.topo h1{
  font-size:36px;
  margin-bottom:8px;
}

.topo p{
  opacity:.9;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-bottom:25px;
}

.card{
  background:#1e293b;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:22px;
}

.card h3{
  color:#94a3b8;
  font-size:13px;
  margin-bottom:12px;
}

.card p{
  font-size:28px;
  font-weight:bold;
}

.formulario{
  background:#1e293b;
  padding:25px;
  border-radius:24px;
  margin-bottom:25px;
}

.formulario h2{
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

input,
select{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#0f172a;
  color:white;
  outline:none;
}

button{
  border:none;
  cursor:pointer;
  border-radius:14px;
  font-weight:bold;
}

.btn{
  width:100%;
  padding:16px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  margin-top:18px;
  font-size:15px;
}

.busca{
  margin-bottom:20px;
}

.busca input{
  background:#1e293b;
}

  background:#1e293b;
  border-radius:22px;
  margin-bottom:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);

  padding:22px;
  display:flex;
  justify-content:space-between;

  .parcela-topo{

</style>
</head>
<body>

<div class="container">

  <div class="topo">
    <h1>FinancePro</h1>
    <p>Controle inteligente de clientes e parcelas</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>TOTAL A RECEBER</h3>
      <p id="totalReceber">R$ 0</p>
    </div>

    <div class="card">
      <h3>TOTAL RECEBIDO</h3>
      <p id="totalPago">R$ 0</p>
    </div>

    <div class="card">
      <h3>ATRASADO</h3>
      <p id="totalAtrasado">R$ 0</p>
    </div>

    <div class="card">
      <h3>CLIENTES</h3>
      <p id="totalClientes">0</p>
    </div>

  </div>

  <div class="busca">
    <input
      type="text"
      id="busca"
      placeholder="Buscar cliente..."
      onkeyup="carregar()"
    >
  </div>

  <div class="formulario">

    <h2>Nova Promissória</h2>

    <div class="grid">

      <input type="text" id="nome" placeholder="Cliente">

      <input type="text" id="telefone" placeholder="Telefone">

      <input type="text" id="descricao" placeholder="Descrição">

      <input type="number" id="valorTotal" placeholder="Valor Total">

      <select id="numParcelas">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
        <option value="6">6x</option>
        <option value="12">12x</option>
      </select>

      <input type="date" id="vencimento">

    </div>

    <button class="btn" onclick="salvar(this)">
      SALVAR PROMISSÓRIA
    </button>

  </div>

  <div id="clientes"></div>

</div>

<script>

const API = 'https://script.google.com/macros/s/AKfycbwqEZxapoen_DXGAMGGVD1ZZ1uJ6Yn9cNc2aybxndDQ5jLk7uuPihFHG_dXuGXD-EXq/exec';

async function api(acao,dados={}){

  const formData = new FormData();

  formData.append('acao',acao);

  for(let chave in dados){
    formData.append(chave,dados[chave]);
  }

  const response = await fetch(API,{
    method:'POST',
    body:formData
  });

  return await response.json();

}

async function salvar(btn){

  const nome = document.getElementById('nome').value;
  const telefone = document.getElementById('telefone').value;
  const descricao = document.getElementById('descricao').value;
  const valorTotal = document.getElementById('valorTotal').value;
  const numParcelas = document.getElementById('numParcelas').value;
  const vencimento = document.getElementById('vencimento').value;

  if(!nome || !valorTotal || !vencimento){
    alert('Preencha os campos');
    return;
  }

  btn.innerHTML='SALVANDO...';
  btn.disabled=true;

  await api('salvar',{
    nome,
    telefone,
    descricao,
    valorTotal,
    numParcelas,
    vencimento
  });

  btn.innerHTML='SALVAR PROMISSÓRIA';
  btn.disabled=false;

  document.getElementById('nome').value='';
  document.getElementById('telefone').value='';
  document.getElementById('descricao').value='';
  document.getElementById('valorTotal').value='';
  document.getElementById('numParcelas').value='1';
  document.getElementById('vencimento').value='';

  carregar();

}

async function carregar(){

  const resultado = await api('listar');

  const dados = resultado.data || [];

  const busca = document
    .getElementById('busca')
    .value
    .toLowerCase();

  let totalReceber=0;
  let totalPago=0;
  let totalAtrasado=0;

  const clientes={};

  dados.forEach(item=>{

    if(
      !String(item[2]).toLowerCase().includes(busca)
    ){
      return;
    }

    const status=item[10];
    const valor=Number(item[7]);

    if(status==='PAGO'){
      totalPago+=valor;
    }else{
      totalReceber+=valor;
    }

    if(status==='ATRASADO'){
      totalAtrasado+=valor;
    }

    if(!clientes[item[2]]){
      clientes[item[2]]=[];
    }

    clientes[item[2]].push(item);

  });

  document.getElementById('totalReceber').innerHTML=dinheiro(totalReceber);
  document.getElementById('totalPago').innerHTML=dinheiro(totalPago);
  document.getElementById('totalAtrasado').innerHTML=dinheiro(totalAtrasado);
  document.getElementById('totalClientes').innerHTML=Object.keys(clientes).length;

  const container=document.getElementById('clientes');

  container.innerHTML='';

  if(Object.keys(clientes).length===0){

    container.innerHTML=`
      <div class="vazio">
        Nenhum cliente encontrado
      </div>
    `;

    return;

  }

  Object.keys(clientes).forEach((nome,index)=>{

    const parcelas=clientes[nome];

    let total=0;

    parcelas.forEach(p=>{

      if(p[10]!=='PAGO'){
        total+=Number(p[7]);
      }

    });

    let html=`
      <div class="cliente">

        <div
          class="cliente-topo"
          onclick="toggle(${index})">

          <div>

            <div class="cliente-nome">
              ${nome}
            </div>

            <div style="margin-top:8px;color:#94a3b8">
              ${parcelas.length} parcela(s)
            </div>

          </div>

          <div class="cliente-total">
            ${dinheiro(total)}
          </div>

        </div>

        <div class="parcelas" id="box${index}">
    `;

    parcelas.forEach(p=>{

      let classe='pendente';

      if(p[10]==='PAGO') classe='pago';
      if(p[10]==='ATRASADO') classe='atrasado';

      html+=`

        <div class="parcela">

          <div class="parcela-topo">

            <div class="parcela-info">

              <div class="parcela-desc">
                ${p[4]}
              </div>

              <div class="parcela-meta">

                <span>
                  ${p[5]}/${p[6]}
                </span>

                <span>
                  ${new Date(p[9]).toLocaleDateString('pt-BR')}
                </span>

                <span class="badge ${classe}">
                  ${p[10]}
                </span>

              </div>

            </div>

            <div class="valor">
              ${dinheiro(p[7])}
            </div>

          </div>

          ${
            p[10]!=='PAGO'
            ?
            `
              <button
                class="btnPago"
                onclick="pagar('${p[0]}')">
                MARCAR COMO PAGO
              </button>
            `
            :
            ''
          }

        </div>

      `;

    });

    html+=`
        </div>
      </div>
    `;

    container.innerHTML+=html;

  });

}

function toggle(id){

  document
    .getElementById('box'+id)
    .classList
    .toggle('aberto');

}

async function pagar(id){

  const ok=confirm('Confirmar pagamento?');

  if(!ok) return;

  await api('pagar',{id});

  carregar();

}

function dinheiro(valor){

  return Number(valor).toLocaleString('pt-BR',{
    style:'currency',
    currency:'BRL'
  });

}

carregar();

</script>

</body>
</html>
