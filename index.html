<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinancePro</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  padding:20px;
}

.container{
  max-width:1450px;
  margin:auto;
}

.topo{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  padding:30px;
  border-radius:24px;
  margin-bottom:25px;
}

.topo h1{
  font-size:34px;
  margin-bottom:8px;
}

.topo p{
  opacity:.9;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  margin-bottom:25px;
}

.card{
  background:#1e293b;
  border-radius:22px;
  padding:22px;
}

.card h3{
  color:#94a3b8;
  font-size:12px;
  margin-bottom:10px;
}

.card p{
  font-size:30px;
  font-weight:bold;
}

.formulario{
  background:#1e293b;
  border-radius:24px;
  padding:25px;
  margin-bottom:25px;
}

.formulario h2{
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

input,
select{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#0f172a;
  color:white;
  outline:none;
}

.preview{
  margin-top:15px;
  background:#0f172a;
  padding:16px;
  border-radius:16px;
  color:#94a3b8;
}

.preview strong{
  color:white;
  font-size:20px;
}

button{
  border:none;
  cursor:pointer;
  border-radius:14px;
  font-weight:bold;
}

.btn{
  width:100%;
  padding:16px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  margin-top:18px;
}

.filtros{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.filtro{
  background:#1e293b;
  color:#cbd5e1;
  padding:12px 18px;
  border-radius:14px;
  cursor:pointer;
}

.filtro.ativo{
  background:#2563eb;
  color:white;
}

.busca{
  margin-bottom:20px;
}

.busca input{
  background:#1e293b;
}

.cliente{
  background:#1e293b;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:18px;
}

.cliente-topo{
  padding:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.cliente-nome{
  font-size:20px;
  font-weight:bold;
}

.cliente-sub{
  color:#94a3b8;
  margin-top:6px;
  font-size:13px;
}

.cliente-total{
  font-size:28px;
  font-weight:bold;
}

.parcelas{
  display:none;
  padding:15px;
  background:#111827;
}

.parcelas.aberto{
  display:block;
}

.parcela{
  background:#0f172a;
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
}

.parcela-topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.parcela-esq{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.parcela-desc{
  font-size:17px;
  font-weight:bold;
}

.meta{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  color:#94a3b8;
  font-size:13px;
}

.valor{
  font-size:26px;
  font-weight:bold;
}

.badge{
  padding:5px 10px;
  border-radius:30px;
  font-size:11px;
  font-weight:bold;
}

.pendente{
  background:#78350f;
  color:#fdba74;
}

.pago{
  background:#14532d;
  color:#86efac;
}

.atrasado{
  background:#7f1d1d;
  color:#fca5a5;
}

.btnPago{
  width:100%;
  margin-top:14px;
  padding:13px;
  background:#16a34a;
  color:white;
}

.vazio{
  background:#1e293b;
  padding:40px;
  border-radius:20px;
  text-align:center;
  color:#94a3b8;
}

@media(max-width:700px){

  .cliente-topo,
  .parcela-topo{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>
</head>
<body>

<div class="container">

  <div class="topo">
    <h1>Maiso Veículos</h1>
    <p>Controle de promissórias</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>TOTAL A RECEBER</h3>
      <p id="totalReceber">R$ 0</p>
    </div>

    <div class="card">
      <h3>RECEBER ESTE MÊS</h3>
      <p id="mesReceber">R$ 0</p>
    </div>

    <div class="card">
      <h3>RECEBIDO ESTE MÊS</h3>
      <p id="mesPago">R$ 0</p>
    </div>

    <div class="card">
      <h3>ATRASADO</h3>
      <p id="totalAtrasado">R$ 0</p>
    </div>

  </div>

  <div class="formulario">

    <h2>Nova Promissória</h2>

    <div class="grid">

      <input type="text" id="nome" placeholder="Cliente">

      <input type="text" id="telefone" placeholder="Telefone">

      <input type="text" id="descricao" placeholder="Descrição">

      <input type="number" id="valorTotal" placeholder="Valor Total" oninput="previewParcela()">

      <select id="numParcelas" onchange="previewParcela()">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
        <option value="6">6x</option>
        <option value="12">12x</option>
      </select>

      <input type="date" id="vencimento">

    </div>

    <div class="preview">
      Cada parcela ficará em:
      <br><br>
      <strong id="valorParcela">R$ 0,00</strong>
    </div>

    <button class="btn" onclick="salvar(this)">
      SALVAR PROMISSÓRIA
    </button>

  </div>

  <div class="filtros">

    <div class="filtro ativo" onclick="setFiltro('TODOS',this)">
      TODOS
    </div>

    <div class="filtro" onclick="setFiltro('PENDENTE',this)">
      PENDENTES
    </div>

    <div class="filtro" onclick="setFiltro('ATRASADO',this)">
      ATRASADOS
    </div>

    <div class="filtro" onclick="setFiltro('PAGO',this)">
      PAGOS
    </div>

  </div>

  <div class="busca">
    <input
      type="text"
      id="busca"
      placeholder="Buscar cliente..."
      onkeyup="carregar()"
    >
  </div>

  <div id="clientes"></div>

</div>

<script>

const API='https://script.google.com/macros/s/AKfycbwqEZxapoen_DXGAMGGVD1ZZ1uJ6Yn9cNc2aybxndDQ5jLk7uuPihFHG_dXuGXD-EXq/exec';

let FILTRO='TODOS';

async function api(acao,dados={}){

  const formData=new FormData();

  formData.append('acao',acao);

  for(let chave in dados){
    formData.append(chave,dados[chave]);
  }

  const response=await fetch(API,{
    method:'POST',
    body:formData
  });

  return await response.json();

}

function previewParcela(){

  const valor=
    Number(
      document.getElementById('valorTotal').value
    );

  const parcelas=
    Number(
      document.getElementById('numParcelas').value
    );

  const total=valor/parcelas || 0;

  document.getElementById('valorParcela')
    .innerHTML=dinheiro(total);

}

function setFiltro(tipo,el){

  FILTRO=tipo;

  document
    .querySelectorAll('.filtro')
    .forEach(btn=>btn.classList.remove('ativo'));

  el.classList.add('ativo');

  carregar();

}

async function salvar(btn){

  const nome=document.getElementById('nome').value;
  const telefone=document.getElementById('telefone').value;
  const descricao=document.getElementById('descricao').value;
  const valorTotal=document.getElementById('valorTotal').value;
  const numParcelas=document.getElementById('numParcelas').value;
  const vencimento=document.getElementById('vencimento').value;

  if(!nome || !valorTotal || !vencimento){
    alert('Preencha os campos');
    return;
  }

  btn.innerHTML='SALVANDO...';
  btn.disabled=true;

  await api('salvar',{
    nome,
    telefone,
    descricao,
    valorTotal,
    numParcelas,
    vencimento
  });

  btn.innerHTML='SALVAR PROMISSÓRIA';
  btn.disabled=false;

  carregar();

}

async function carregar(){

  const resultado=await api('listar');

  const dados=resultado.data || [];

  const busca=
    document
      .getElementById('busca')
      .value
      .toLowerCase();

  const hoje=new Date();

  let totalReceber=0;
  let totalAtrasado=0;
  let mesReceber=0;
  let mesPago=0;

  const clientes={};

  dados.forEach(item=>{

    const nome=item[2];
    const status=item[10];
    const valor=Number(item[7]);
    const vencimento=new Date(item[9]);

    if(
      !nome.toLowerCase().includes(busca)
    ){
      return;
    }

    if(
      FILTRO!=='TODOS' &&
      status!==FILTRO
    ){
      return;
    }

    if(status!=='PAGO'){
      totalReceber+=valor;
    }

    if(status==='ATRASADO'){
      totalAtrasado+=valor;
    }

    if(
      vencimento.getMonth()===hoje.getMonth() &&
      vencimento.getFullYear()===hoje.getFullYear()
    ){

      if(status==='PAGO'){
        mesPago+=valor;
      }else{
        mesReceber+=valor;
      }

    }

    if(!clientes[nome]){
      clientes[nome]=[];
    }

    clientes[nome].push(item);

  });

  document.getElementById('totalReceber').innerHTML=dinheiro(totalReceber);
  document.getElementById('totalAtrasado').innerHTML=dinheiro(totalAtrasado);
  document.getElementById('mesReceber').innerHTML=dinheiro(mesReceber);
  document.getElementById('mesPago').innerHTML=dinheiro(mesPago);

  const container=document.getElementById('clientes');

  container.innerHTML='';

  if(Object.keys(clientes).length===0){

    container.innerHTML=`
      <div class="vazio">
        Nenhuma parcela encontrada
      </div>
    `;

    return;

  }

  Object.keys(clientes).forEach((nome,index)=>{

    const parcelas=clientes[nome];

    let total=0;

    parcelas.forEach(p=>{

      if(p[10]!=='PAGO'){
        total+=Number(p[7]);
      }

    });

    let html=`

      <div class="cliente">

        <div class="cliente-topo"
          onclick="toggle(${index})">

          <div>

            <div class="cliente-nome">
              ${nome}
            </div>

            <div class="cliente-sub">
              ${parcelas.length} parcela(s)
            </div>

          </div>

          <div class="cliente-total">
            ${dinheiro(total)}
          </div>

        </div>

        <div class="parcelas" id="box${index}">
    `;

    parcelas.forEach(p=>{

      let classe='pendente';

      if(p[10]==='PAGO') classe='pago';
      if(p[10]==='ATRASADO') classe='atrasado';

      html+=`

        <div class="parcela">

          <div class="parcela-topo">

            <div class="parcela-esq">

              <div class="parcela-desc">
                ${p[4]}
              </div>

              <div class="meta">

                <span>
                  ${p[5]}/${p[6]}
                </span>

                <span>
                  ${new Date(p[9]).toLocaleDateString('pt-BR')}
                </span>

                <span class="badge ${classe}">
                  ${p[10]}
                </span>

              </div>

            </div>

            <div class="valor">
              ${dinheiro(p[7])}
            </div>

          </div>

          ${
            p[10]!=='PAGO'
            ?
            `
            <button
              class="btnPago"
              onclick="pagar('${p[0]}')">
              MARCAR COMO PAGO
            </button>
            `
            :
            ''
          }

        </div>

      `;

    });

    html+=`
        </div>
      </div>
    `;

    container.innerHTML+=html;

  });

}

function toggle(id){

  document
    .getElementById('box'+id)
    .classList
    .toggle('aberto');

}

async function pagar(id){

  const ok=confirm('Confirmar pagamento?');

  if(!ok) return;

  await api('pagar',{id});

  carregar();

}

function dinheiro(valor){

  return Number(valor).toLocaleString('pt-BR',{
    style:'currency',
    currency:'BRL'
  });

}

previewParcela();

carregar();

</script>

</body>
</html>
