<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoPromissorias - Gestão de Vendas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0e17;
            color: #e8edf5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 1400px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1c2640;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            background: linear-gradient(135deg, #ff8a5c, #e65c2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .sub {
            color: #6a7fa0;
            font-size: 14px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }

        .metric-card {
            background: #121a2e;
            border-radius: 18px;
            padding: 18px 16px;
            border: 1px solid #1f2a45;
            transition: 0.2s;
        }

        .metric-card:hover {
            border-color: #3a4a70;
        }

        .metric-card .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6a7fa0;
            margin-bottom: 6px;
        }

        .metric-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        .metric-card .value.highlight {
            background: linear-gradient(135deg, #ff8a5c, #e65c2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .metric-card .value.danger {
            color: #f58a8a;
        }

        .form-section {
            background: #121a2e;
            border-radius: 20px;
            padding: 24px 28px;
            margin-bottom: 28px;
            border: 1px solid #1f2a45;
        }

        .form-section .form-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 18px;
            color: #c8d6f0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px;
        }

        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            background: #0e1525;
            border: 1px solid #22304a;
            border-radius: 12px;
            padding: 13px 15px;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            width: 100%;
        }

        .form-grid input:focus,
        .form-grid select:focus,
        .form-grid textarea:focus {
            border-color: #e65c2a;
            box-shadow: 0 0 0 3px rgba(230, 92, 42, 0.12);
        }

        .form-grid input::placeholder,
        .form-grid textarea::placeholder {
            color: #4a5f80;
        }

        .form-grid textarea {
            resize: vertical;
            min-height: 50px;
            font-family: inherit;
        }

        .preview-block {
            margin-top: 16px;
            padding: 14px 18px;
            background: #0e1525;
            border-radius: 14px;
            border-left: 3px solid #e65c2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .preview-block .preview-label {
            color: #7a8fa8;
            font-size: 13px;
        }

        .preview-block .preview-value {
            font-size: 24px;
            font-weight: 700;
            color: #c8d6f0;
        }

        .btn-primary {
            background: #e65c2a;
            border: none;
            border-radius: 12px;
            padding: 15px 22px;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 18px;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            background: #d04a1a;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(230, 92, 42, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .filter-btn {
            background: #121a2e;
            border: 1px solid #22304a;
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 500;
            color: #7a8fa8;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn:hover {
            background: #1a2640;
        }

        .filter-btn.active {
            background: #e65c2a;
            border-color: #e65c2a;
            color: #fff;
        }

        .filter-btn.antigos {
            border-color: #4a3a5a;
        }

        .filter-btn.antigos.active {
            background: #7a5a9a;
            border-color: #7a5a9a;
        }

        .search-box {
            margin-bottom: 18px;
        }

        .search-box input {
            width: 100%;
            background: #121a2e;
            border: 1px solid #22304a;
            border-radius: 14px;
            padding: 13px 18px;
            color: #e8edf5;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: #e65c2a;
            box-shadow: 0 0 0 3px rgba(230, 92, 42, 0.08);
        }

        .search-box input::placeholder {
            color: #4a5f80;
        }

        .client-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .client-card {
            background: #121a2e;
            border-radius: 18px;
            border: 1px solid #1f2a45;
            overflow: hidden;
            transition: 0.2s;
        }

        .client-card:hover {
            border-color: #334a6a;
        }

        .client-card.quitado {
            opacity: 0.75;
            border-color: #3a2a4a;
        }

        .client-card.quitado .client-header:hover {
            background: #161f35;
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            cursor: pointer;
            transition: 0.15s;
        }

        .client-header:hover {
            background: #161f35;
        }

        .client-info {
            flex: 1;
        }

        .client-name {
            font-size: 19px;
            font-weight: 600;
            color: #e8edf5;
        }

        .client-name .quitado-badge {
            font-size: 12px;
            font-weight: 500;
            color: #a88ac8;
            background: #2a1a3a;
            padding: 2px 12px;
            border-radius: 20px;
            margin-left: 10px;
        }

        .client-details {
            font-size: 13px;
            color: #6a7fa0;
            margin-top: 3px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .client-details .moto {
            color: #ff8a5c;
            font-weight: 500;
        }

        .client-details .obs {
            color: #7a8fa8;
            font-style: italic;
            font-size: 12px;
        }

        .client-total {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff8a5c, #e65c2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            margin-left: 12px;
        }

        .client-total.quitado {
            background: linear-gradient(135deg, #c8b8d8, #a88ac8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .parcelas-wrapper {
            display: none;
            padding: 0 22px 22px 22px;
            background: #0e1525;
            border-top: 1px solid #1f2a45;
            animation: slideDown 0.2s ease;
        }

        .parcelas-wrapper.open {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .parcela-item {
            background: #0a0e17;
            border-radius: 14px;
            padding: 16px 18px;
            margin-top: 12px;
            border: 1px solid #1f2a45;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .parcela-item:hover {
            border-color: #334a6a;
        }

        .parcela-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .parcela-desc {
            font-weight: 500;
            color: #c8d6f0;
        }

        .parcela-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 13px;
            color: #6a7fa0;
        }

        .badge-status {
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-pendente {
            background: #2a2a1a;
            color: #e8d57a;
        }

        .badge-pago {
            background: #1a2a1a;
            color: #7ad4a0;
        }

        .badge-atrasado {
            background: #2a1a1a;
            color: #f58a8a;
            animation: pulseBadge 1.8s infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .parcela-valor {
            font-size: 22px;
            font-weight: 700;
            color: #e8edf5;
        }

        .btn-pagar {
            background: #1a4a2a;
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            font-weight: 600;
            font-size: 13px;
            color: #b0e8c0;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }

        .btn-pagar:hover {
            background: #2a5a3a;
            color: #fff;
        }

        .btn-editar {
            background: #1a2a4a;
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            font-weight: 600;
            font-size: 13px;
            color: #8ab8f5;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }

        .btn-editar:hover {
            background: #2a3a5a;
            color: #aac8ff;
        }

        .btn-excluir {
            background: #4a1a1a;
            border: none;
            border-radius: 10px;
            padding: 11px 18px;
            font-weight: 600;
            font-size: 13px;
            color: #f58a8a;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }

        .btn-excluir:hover {
            background: #5a2a2a;
            color: #ffaaaa;
        }

        .btn-excluir-contrato {
            background: #3a1a1a;
            border: 1px solid #5a2a2a;
            border-radius: 10px;
            padding: 11px 18px;
            font-weight: 600;
            font-size: 13px;
            color: #f58a8a;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 6px;
        }

        .btn-excluir-contrato:hover {
            background: #5a2a2a;
            color: #ffaaaa;
            border-color: #8a3a3a;
        }

        .botoes-acao {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .botoes-acao .btn-pagar,
        .botoes-acao .btn-editar,
        .botoes-acao .btn-excluir {
            flex: 1;
            margin-top: 0;
        }

        .pago-info {
            margin-top: 10px;
            color: #7ad4a0;
            font-size: 14px;
            text-align: center;
        }

        .empty-state {
            background: #121a2e;
            border-radius: 18px;
            padding: 50px 24px;
            text-align: center;
            color: #6a7fa0;
            border: 1px dashed #22304a;
            font-size: 16px;
        }

        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 14px 26px;
            border-radius: 14px;
            color: #fff;
            font-weight: 500;
            z-index: 999;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.3s ease;
            max-width: 380px;
        }

        .toast-success {
            background: #1a4a2a;
            border-left: 4px solid #5aca7a;
        }

        .toast-error {
            background: #4a1a1a;
            border-left: 4px solid #e05a5a;
        }

        .toast-info {
            background: #1a2a4a;
            border-left: 4px solid #5a8ad9;
        }

        @keyframes toastIn {
            from {
                transform: translateX(50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .obs-interna {
            background: #1a1a2a;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            color: #8a7a9a;
            border-left: 2px solid #4a3a5a;
            margin-top: 4px;
            font-style: italic;
        }

        /* Modal de edição */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #121a2e;
            border-radius: 24px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #2a3a5a;
        }

        .modal h2 {
            color: #c8d6f0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .modal .form-grid {
            grid-template-columns: 1fr;
        }

        .modal .botoes-modal {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal .botoes-modal button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal .btn-salvar-edicao {
            background: #e65c2a;
            color: #fff;
        }

        .modal .btn-salvar-edicao:hover {
            background: #d04a1a;
        }

        .modal .btn-cancelar-edicao {
            background: #2a2a3a;
            color: #8a8aaa;
        }

        .modal .btn-cancelar-edicao:hover {
            background: #3a3a4a;
        }

        @media (max-width: 700px) {
            .client-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .parcela-item {
                flex-direction: column;
                align-items: stretch;
            }
            .metric-grid {
                grid-template-columns: 1fr 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 20px;
            }
            .client-total {
                font-size: 20px;
                margin-left: 0;
            }
            .botoes-acao {
                flex-direction: column;
            }
            .botoes-modal {
                flex-direction: column;
            }
        }

        @media (max-width: 450px) {
            .metric-grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <header class="header">
            <div>
                <h1>MotoPromissorias</h1>
                <span class="sub">Gestao de vendas com lembretes automaticos via WhatsApp</span>
            </div>
            <div style="font-size:13px; color:#e65c2a;">v2.0</div>
        </header>

        <section class="metric-grid">
            <div class="metric-card">
                <div class="label">Total a Receber</div>
                <div class="value highlight" id="totalReceber">R$ 0</div>
            </div>
            <div class="metric-card">
                <div class="label">Receber este Mes</div>
                <div class="value" id="mesReceber">R$ 0</div>
            </div>
            <div class="metric-card">
                <div class="label">Recebido este Mes</div>
                <div class="value" id="mesPago">R$ 0</div>
            </div>
            <div class="metric-card">
                <div class="label">Total Atrasado</div>
                <div class="value danger" id="totalAtrasado">R$ 0</div>
            </div>
            <div class="metric-card">
                <div class="label">Clientes Ativos</div>
                <div class="value" id="totalClientes">0</div>
            </div>
        </section>

        <section class="form-section">
            <div class="form-title">Nova Venda de Moto</div>
            <div class="form-grid">
                <input type="text" id="nome" placeholder="Nome do cliente" />
                <input type="text" id="telefone" placeholder="WhatsApp (com DDD)" value="89981067904" />
                <input type="text" id="moto" placeholder="Moto (ex: Honda CG 160 2024)" />
                <input type="text" id="descricao" placeholder="Descricao do contrato" />
                <input type="number" id="valorTotal" placeholder="Valor total" oninput="atualizarPreview()" />
                <select id="numParcelas" onchange="atualizarPreview()">
                    <option value="1">1 parcela</option>
                    <option value="2">2 parcelas</option>
                    <option value="3">3 parcelas</option>
                    <option value="4">4 parcelas</option>
                    <option value="5">5 parcelas</option>
                    <option value="6">6 parcelas</option>
                    <option value="12">12 parcelas</option>
                </select>
                <input type="date" id="vencimento" />
                <textarea id="observacao" placeholder="Observacao interna (so voce ve)"></textarea>
            </div>

            <div class="preview-block">
                <span class="preview-label">Valor por parcela</span>
                <span class="preview-value" id="valorParcela">R$ 0,00</span>
            </div>

            <button class="btn-primary" id="btnSalvar" onclick="salvar()">Salvar Venda</button>
        </section>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="TODOS" onclick="setFiltro('TODOS', this)">Todos</button>
            <button class="filter-btn" data-filter="PENDENTE" onclick="setFiltro('PENDENTE', this)">Pendentes</button>
            <button class="filter-btn" data-filter="ATRASADO" onclick="setFiltro('ATRASADO', this)">Atrasados</button>
            <button class="filter-btn" data-filter="PAGO" onclick="setFiltro('PAGO', this)">Pagos</button>
            <button class="filter-btn antigos" data-filter="ANTIGOS" onclick="setFiltro('ANTIGOS', this)">Antigos Clientes</button>
        </div>

        <div class="search-box">
            <input type="text" id="busca" placeholder="Buscar cliente ou moto..." oninput="carregarClientes()" />
        </div>

        <div class="client-list" id="clientesContainer">
            <div class="empty-state">Carregando...</div>
        </div>

    </div>

    <!-- Modal de Edição -->
    <div class="modal-overlay" id="modalEditar">
        <div class="modal">
            <h2>Editar Parcela</h2>
            <div class="form-grid">
                <input type="text" id="editNome" placeholder="Nome do cliente" />
                <input type="text" id="editTelefone" placeholder="WhatsApp (com DDD)" />
                <input type="text" id="editMoto" placeholder="Moto" />
                <input type="text" id="editDescricao" placeholder="Descricao" />
                <input type="number" id="editValor" placeholder="Valor da parcela" step="0.01" />
                <input type="date" id="editVencimento" />
                <textarea id="editObservacao" placeholder="Observacao interna"></textarea>
            </div>
            <div class="botoes-modal">
                <button class="btn-cancelar-edicao" onclick="fecharModalEdicao()">Cancelar</button>
                <button class="btn-salvar-edicao" onclick="salvarEdicao()">Salvar Alteracoes</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL =
            'https://script.google.com/macros/s/AKfycbww_lQmPPVPo-BqEMlrl1yg6-jlrXbglt2rpFGF-d45JJtGtGWHB8kSQRFPUFCDx9Ki/exec';

        let filtroAtual = 'TODOS';
        let dadosCache = [];
        let dadosAntigos = [];
        let parcelaEditando = null;

        function formatarMoeda(valor) {
            return Number(valor).toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
        }

        function mostrarAlerta(mensagem, tipo = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${tipo}`;
            toast.textContent = mensagem;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                toast.style.transition = '0.3s';
                setTimeout(() => toast.remove(), 350);
            }, 3800);
        }

        function previewParcela() {
            const total = parseFloat(document.getElementById('valorTotal').value) || 0;
            const parcelas = parseInt(document.getElementById('numParcelas').value) || 1;
            const valor = total / parcelas;
            document.getElementById('valorParcela').textContent = formatarMoeda(valor);
        }

        function atualizarPreview() {
            previewParcela();
        }

        async function chamarApi(acao, dados = {}, tentativas = 3) {
            const form = new FormData();
            form.append('acao', acao);
            Object.entries(dados).forEach(([k, v]) => form.append(k, String(v)));

            for (let i = 0; i < tentativas; i++) {
                try {
                    const resp = await fetch(API_URL, { method: 'POST', body: form });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const json = await resp.json();
                    return json.data || {};
                } catch (err) {
                    console.warn(`Tentativa ${i+1} falhou:`, err);
                    if (i === tentativas - 1) {
                        mostrarAlerta('Erro de conexao. Tente novamente.', 'error');
                        return {};
                    }
                    await new Promise(r => setTimeout(r, 1000 * (i + 1)));
                }
            }
            return {};
        }

        async function salvar() {
            const nome = document.getElementById('nome').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const moto = document.getElementById('moto').value.trim();
            const descricao = document.getElementById('descricao').value.trim();
            const observacao = document.getElementById('observacao').value.trim();
            const valorTotal = document.getElementById('valorTotal').value;
            const numParcelas = document.getElementById('numParcelas').value;
            const vencimento = document.getElementById('vencimento').value;

            if (!nome) return mostrarAlerta('Informe o nome do cliente.', 'error');
            if (!moto) return mostrarAlerta('Informe a moto que foi vendida.', 'error');
            if (!valorTotal || parseFloat(valorTotal) <= 0) return mostrarAlerta('Informe um valor valido.', 'error');
            if (!vencimento) return mostrarAlerta('Informe a data de vencimento.', 'error');

            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            btn.textContent = 'Salvando...';

            const descricaoCompleta = descricao ? `${moto} - ${descricao}` : moto;

            const resultado = await chamarApi('salvar', {
                nome,
                telefone,
                descricao: descricaoCompleta,
                moto,
                observacao,
                valorTotal,
                numParcelas,
                vencimento
            });

            btn.disabled = false;
            btn.textContent = 'Salvar Venda';

            if (resultado.sucesso) {
                mostrarAlerta('Venda salva com sucesso!', 'success');
                document.getElementById('nome').value = '';
                document.getElementById('telefone').value = '89981067904';
                document.getElementById('moto').value = '';
                document.getElementById('descricao').value = '';
                document.getElementById('observacao').value = '';
                document.getElementById('valorTotal').value = '';
                document.getElementById('vencimento').value = '';
                document.getElementById('numParcelas').value = '1';
                previewParcela();
                carregarClientes(true);
            } else {
                mostrarAlerta('Erro ao salvar. Tente novamente.', 'error');
            }
        }

        function setFiltro(tipo, el) {
            filtroAtual = tipo;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            carregarClientes(true);
        }

        async function carregarClientes(forcar = false) {
            if (!forcar && dadosCache.length > 0) {
                renderizar(dadosCache);
                return;
            }

            const container = document.getElementById('clientesContainer');
            container.innerHTML = '<div class="empty-state">Carregando...</div>';

            const resultado = await chamarApi('listar');
            const lista = resultado || [];

            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            const clientesAtivos = [];
            const clientesAntigos = [];

            const contratos = new Map();
            lista.forEach(row => {
                const contratoId = row[1];
                if (!contratos.has(contratoId)) {
                    contratos.set(contratoId, []);
                }
                contratos.get(contratoId).push(row);
            });

            const contratosQuitados = new Set();
            for (const [contratoId, parcelas] of contratos) {
                const todasPagas = parcelas.every(p => p[10] === 'PAGO');
                if (todasPagas && parcelas.length > 0) {
                    contratosQuitados.add(contratoId);
                }
            }

            lista.forEach((row) => {
                const contratoId = row[1];
                const isQuitado = contratosQuitados.has(contratoId);

                if (row[10] !== 'PAGO' && !isQuitado) {
                    const venc = new Date(row[9]);
                    venc.setHours(0, 0, 0, 0);
                    if (venc < hoje && row[10] !== 'ATRASADO') {
                        row[10] = 'ATRASADO';
                    }
                }

                if (isQuitado) {
                    clientesAntigos.push(row);
                } else {
                    clientesAtivos.push(row);
                }
            });

            dadosCache = clientesAtivos;
            dadosAntigos = clientesAntigos;
            renderizar(clientesAtivos);
        }

        function renderizar(dados) {
            const busca = document.getElementById('busca').value.toLowerCase().trim();
            const container = document.getElementById('clientesContainer');

            let listaParaRenderizar = [];
            let isAntigos = false;

            if (filtroAtual === 'ANTIGOS') {
                listaParaRenderizar = dadosAntigos;
                isAntigos = true;
            } else {
                listaParaRenderizar = dados;
            }

            let filtrados = listaParaRenderizar.filter(row => {
                const nome = (row[2] || '').toLowerCase();
                const moto = (row[14] || '').toLowerCase();
                if (busca && !nome.includes(busca) && !moto.includes(busca)) return false;
                if (filtroAtual !== 'TODOS' && filtroAtual !== 'ANTIGOS' && row[10] !== filtroAtual) return false;
                return true;
            });

            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            const mesAtual = hoje.getMonth();
            const anoAtual = hoje.getFullYear();

            let totalReceber = 0;
            let totalAtrasado = 0;
            let mesReceber = 0;
            let mesPago = 0;
            const clientesSet = new Set();

            dados.forEach(row => {
                const status = row[10];
                const valor = parseFloat(row[7]) || 0;
                const venc = new Date(row[9]);
                venc.setHours(0, 0, 0, 0);

                if (status !== 'PAGO') totalReceber += valor;
                if (status === 'ATRASADO') totalAtrasado += valor;

                if (venc.getMonth() === mesAtual && venc.getFullYear() === anoAtual) {
                    if (status === 'PAGO') mesPago += valor;
                    else mesReceber += valor;
                }

                if (row[2]) clientesSet.add(row[2]);
            });

            document.getElementById('totalReceber').textContent = formatarMoeda(totalReceber);
            document.getElementById('totalAtrasado').textContent = formatarMoeda(totalAtrasado);
            document.getElementById('mesReceber').textContent = formatarMoeda(mesReceber);
            document.getElementById('mesPago').textContent = formatarMoeda(mesPago);
            document.getElementById('totalClientes').textContent = clientesSet.size;

            const grupos = new Map();
            filtrados.forEach(row => {
                const nome = row[2] || 'Sem nome';
                if (!grupos.has(nome)) grupos.set(nome, []);
                grupos.get(nome).push(row);
            });

            if (grupos.size === 0) {
                const mensagem = isAntigos ?
                    'Nenhum cliente antigo encontrado' :
                    'Nenhum cliente encontrado';
                container.innerHTML = `<div class="empty-state">${mensagem}</div>`;
                return;
            }

            let html = '';
            let idx = 0;
            for (const [nome, parcelas] of grupos) {
                const totalCliente = parcelas.reduce((s, p) => p[10] !== 'PAGO' ? s + parseFloat(p[7] || 0) : s, 0);
                const pagas = parcelas.filter(p => p[10] === 'PAGO').length;
                const totalParcelas = parcelas.length;
                const todasPagas = pagas === totalParcelas;

                const moto = parcelas[0]?.[14] || 'Moto nao informada';
                const observacao = parcelas[0]?.[15] || '';
                const contratoId = parcelas[0]?.[1] || '';

                const isQuitado = todasPagas && totalParcelas > 0;

                html += `
                    <div class="client-card ${isQuitado ? 'quitado' : ''}">
                        <div class="client-header" onclick="toggleParcelas(${idx})">
                            <div class="client-info">
                                <div class="client-name">
                                    ${nome}
                                    ${isQuitado ? '<span class="quitado-badge">Quitado</span>' : ''}
                                </div>
                                <div class="client-details">
                                    <span class="moto">${moto}</span>
                                    <span>${totalParcelas} parcelas · ${pagas} pagas</span>
                                    ${isQuitado ? '<span>Contrato finalizado</span>' : ''}
                                </div>
                                ${observacao ? `<div class="obs-interna">${observacao}</div>` : ''}
                            </div>
                            <div class="client-total ${isQuitado ? 'quitado' : ''}">
                                ${formatarMoeda(totalCliente)}
                            </div>
                        </div>
                        <div class="parcelas-wrapper" id="parcelas_${idx}">
                `;

                parcelas.forEach(p => {
                    const status = p[10];
                    let badgeClass = 'badge-pendente';
                    if (status === 'PAGO') badgeClass = 'badge-pago';
                    if (status === 'ATRASADO') badgeClass = 'badge-atrasado';

                    const venc = new Date(p[9]);
                    const vencStr = venc.toLocaleDateString('pt-BR');
                    const desc = p[4] || 'Sem descricao';
                    const parcelaNum = p[5] || '?';
                    const totalParc = p[6] || '?';
                    const valor = parseFloat(p[7] || 0);
                    const idParcela = p[0] || '';

                    html += `
                        <div class="parcela-item">
                            <div class="parcela-info">
                                <div class="parcela-desc">${desc}</div>
                                <div class="parcela-meta">
                                    <span>${parcelaNum}/${totalParc}</span>
                                    <span>Venc: ${vencStr}</span>
                                    <span class="badge-status ${badgeClass}">${status}</span>
                                </div>
                            </div>
                            <div class="parcela-valor">${formatarMoeda(valor)}</div>
                        </div>
                    `;

                    if (status !== 'PAGO' && !isQuitado) {
                        html += `
                            <div class="botoes-acao">
                                <button class="btn-pagar" onclick="marcarPago('${idParcela}')">Marcar como pago</button>
                                <button class="btn-editar" onclick="abrirModalEdicao('${idParcela}')">Editar</button>
                                <button class="btn-excluir" onclick="excluirParcela('${idParcela}')">Excluir</button>
                            </div>
                        `;
                    } else if (status === 'PAGO') {
                        const dataPag = p[11] ? new Date(p[11]).toLocaleDateString('pt-BR') : '';
                        html += `
                            <div class="pago-info">Pago em ${dataPag || 'data desconhecida'}</div>
                            <div class="botoes-acao">
                                <button class="btn-editar" onclick="abrirModalEdicao('${idParcela}')">Editar</button>
                                <button class="btn-excluir" onclick="excluirParcela('${idParcela}')">Excluir</button>
                            </div>
                        `;
                    }
                });

                if (!isQuitado && totalParcelas > 0) {
                    html += `
                        <button class="btn-excluir-contrato" onclick="excluirContrato('${contratoId}')">
                            Excluir contrato inteiro (${totalParcelas} parcelas)
                        </button>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
                idx++;
            }

            container.innerHTML = html;
        }

        function toggleParcelas(idx) {
            const el = document.getElementById(`parcelas_${idx}`);
            if (el) el.classList.toggle('open');
        }

        async function marcarPago(id) {
            if (!confirm('Confirmar pagamento desta parcela?')) return;

            const resultado = await chamarApi('pagar', { id });

            if (resultado.sucesso) {
                if (resultado.contratoQuitado) {
                    mostrarAlerta('Contrato quitado! Cliente movido para Antigos Clientes.', 'success');
                    dadosCache = [];
                    dadosAntigos = [];
                    await carregarClientes(true);
                } else {
                    mostrarAlerta('Parcela marcada como paga!', 'success');
                    dadosCache = [];
                    await carregarClientes(true);
                }
            } else {
                mostrarAlerta('Erro ao marcar como pago.', 'error');
            }
        }

        // ============================================================
        // FUNÇÕES DE EDIÇÃO
        // ============================================================
        function abrirModalEdicao(id) {
            parcelaEditando = id;
            
            // Buscar dados da parcela
            const todasParcelas = [...dadosCache, ...dadosAntigos];
            const parcela = todasParcelas.find(p => p[0] === id);
            
            if (!parcela) {
                mostrarAlerta('Parcela nao encontrada.', 'error');
                return;
            }

            document.getElementById('editNome').value = parcela[2] || '';
            document.getElementById('editTelefone').value = parcela[3] || '';
            document.getElementById('editMoto').value = parcela[14] || '';
            document.getElementById('editDescricao').value = parcela[4] || '';
            document.getElementById('editValor').value = parcela[7] || '';
            
            const vencimento = new Date(parcela[9]);
            const vencStr = vencimento.toISOString().split('T')[0];
            document.getElementById('editVencimento').value = vencStr;
            
            document.getElementById('editObservacao').value = parcela[15] || '';

            document.getElementById('modalEditar').classList.add('active');
        }

        function fecharModalEdicao() {
            document.getElementById('modalEditar').classList.remove('active');
            parcelaEditando = null;
        }

        async function salvarEdicao() {
            if (!parcelaEditando) return;

            const dados = {
                id: parcelaEditando,
                nome: document.getElementById('editNome').value.trim(),
                telefone: document.getElementById('editTelefone').value.trim(),
                moto: document.getElementById('editMoto').value.trim(),
                descricao: document.getElementById('editDescricao').value.trim(),
                valor: document.getElementById('editValor').value,
                vencimento: document.getElementById('editVencimento').value,
                observacao: document.getElementById('editObservacao').value.trim()
            };

            if (!dados.nome) return mostrarAlerta('Informe o nome do cliente.', 'error');
            if (!dados.moto) return mostrarAlerta('Informe a moto.', 'error');
            if (!dados.valor || parseFloat(dados.valor) <= 0) return mostrarAlerta('Informe um valor valido.', 'error');
            if (!dados.vencimento) return mostrarAlerta('Informe a data de vencimento.', 'error');

            const resultado = await chamarApi('editarParcela', dados);

            if (resultado.sucesso) {
                mostrarAlerta('Parcela atualizada com sucesso!', 'success');
                fecharModalEdicao();
                dadosCache = [];
                dadosAntigos = [];
                await carregarClientes(true);
            } else {
                mostrarAlerta('Erro ao editar parcela.', 'error');
            }
        }

        // Fechar modal com ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                fecharModalEdicao();
            }
        });

        // Fechar modal clicando fora
        document.getElementById('modalEditar').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                fecharModalEdicao();
            }
        });

        // ============================================================
        // FUNÇÕES DE EXCLUSÃO
        // ============================================================
        async function excluirParcela(id) {
            if (!confirm('Tem certeza que deseja EXCLUIR esta parcela?\n\nEsta acao nao pode ser desfeita!')) return;

            const resultado = await chamarApi('excluirParcela', { id });

            if (resultado.sucesso) {
                mostrarAlerta('Parcela excluida com sucesso!', 'success');
                dadosCache = [];
                dadosAntigos = [];
                await carregarClientes(true);
            } else {
                mostrarAlerta('Erro ao excluir parcela.', 'error');
            }
        }

        async function excluirContrato(contratoId) {
            if (!confirm('ATENCAO! Voce esta prestes a excluir TODAS as parcelas deste contrato.\n\nEsta acao nao pode ser desfeita!\n\nDeseja continuar?')) return;

            const resultado = await chamarApi('excluirContrato', { contratoId });

            if (resultado.sucesso) {
                mostrarAlerta(`Contrato excluido com sucesso! ${resultado.parcelasExcluidas || 0} parcelas removidas.`, 'success');
                dadosCache = [];
                dadosAntigos = [];
                await carregarClientes(true);
            } else {
                mostrarAlerta('Erro ao excluir contrato.', 'error');
            }
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            previewParcela();
            carregarClientes(true);

            setInterval(() => carregarClientes(true), 30000);

            setInterval(async () => {
                try {
                    await chamarApi('verificarNotificacoes');
                } catch (_) { /* ignora */ }
            }, 300000);
        });

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('busca').focus();
            }
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                document.getElementById('nome').focus();
            }
        });
    </script>

</body>
</html>
