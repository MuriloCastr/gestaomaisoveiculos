<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestão Maiso Veículos</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#f1f5f9;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
}

.topo{
  background:#1e3c72;
  color:white;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
}

.topo h1{
  font-size:32px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.card h2{
  font-size:14px;
  color:#666;
  margin-bottom:10px;
}

.card p{
  font-size:28px;
  font-weight:bold;
}

.formulario{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.formulario h2{
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

button{
  border:none;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  font-weight:bold;
}

.btn{
  background:#2563eb;
  color:white;
  width:100%;
  margin-top:15px;
}

.btn:hover{
  opacity:0.9;
}

.tabela{
  background:white;
  border-radius:15px;
  padding:20px;
  overflow:auto;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:14px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  background:#f8fafc;
}

.status{
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pendente{
  background:#fff7ed;
  color:#ea580c;
}

.pago{
  background:#ecfdf5;
  color:#16a34a;
}

.atrasado{
  background:#fef2f2;
  color:#dc2626;
}

.btnPago{
  background:#16a34a;
  color:white;
  padding:8px 12px;
}

.loading{
  text-align:center;
  padding:20px;
}

@media(max-width:700px){

  .topo h1{
    font-size:24px;
  }

  table{
    font-size:12px;
  }

}

</style>
</head>
<body>

<div class="container">

  <div class="topo">
    <h1>🚗 Gestão Maiso Veículos</h1>
    <p>Controle de Parcelas e Promissórias</p>
  </div>

  <div class="cards">

    <div class="card">
      <h2>PENDENTE</h2>
      <p id="totalPendente">R$ 0</p>
    </div>

    <div class="card">
      <h2>PAGO</h2>
      <p id="totalPago">R$ 0</p>
    </div>

    <div class="card">
      <h2>ATRASADO</h2>
      <p id="totalAtrasado">R$ 0</p>
    </div>

  </div>

  <div class="formulario">

    <h2>Nova Promissória</h2>

    <div class="grid">

      <input type="text" id="nome" placeholder="Cliente">

      <input type="text" id="telefone" placeholder="Telefone">

      <input type="text" id="descricao" placeholder="Descrição">

      <input type="number" id="valorTotal" placeholder="Valor">

      <select id="numParcelas">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
        <option value="6">6x</option>
        <option value="12">12x</option>
      </select>

      <input type="date" id="vencimento">

    </div>

    <button class="btn" onclick="salvar(this)">
      SALVAR
    </button>

  </div>

  <div class="tabela">

    <table>

      <thead>

        <tr>
          <th>Cliente</th>
          <th>Descrição</th>
          <th>Parcela</th>
          <th>Valor</th>
          <th>Vencimento</th>
          <th>Status</th>
          <th>Ação</th>
        </tr>

      </thead>

      <tbody id="lista"></tbody>

    </table>

  </div>

</div>

<script>

const API = 'https://script.google.com/macros/s/AKfycbymd5Zlz8u_sN_XnPxrefler7h6wsBCDVZlYbTJNgUQjBwuYLFaHRO84w7cUez3NO-B/exec';

async function api(acao,dados={}){

  try{

    const response = await fetch(API,{
      method:'POST',
      body:JSON.stringify({
        acao,
        ...dados
      })
    });

    return await response.json();

  }catch(erro){

    alert('Erro: '+erro);

    return null;

  }

}

async function salvar(btn){

  const nome = document.getElementById('nome').value;
  const telefone = document.getElementById('telefone').value;
  const descricao = document.getElementById('descricao').value;
  const valorTotal = document.getElementById('valorTotal').value;
  const numParcelas = document.getElementById('numParcelas').value;
  const vencimento = document.getElementById('vencimento').value;

  if(!nome){
    alert('Digite o nome');
    return;
  }

  if(!valorTotal){
    alert('Digite o valor');
    return;
  }

  if(!vencimento){
    alert('Escolha o vencimento');
    return;
  }

  btn.innerHTML = 'SALVANDO...';
  btn.disabled = true;

  const resultado = await api('salvar',{
    nome,
    telefone,
    descricao,
    valorTotal,
    numParcelas,
    vencimento
  });

  if(resultado?.sucesso || resultado?.status === 'success'){

    alert('Salvo com sucesso');

    document.getElementById('nome').value='';
    document.getElementById('telefone').value='';
    document.getElementById('descricao').value='';
    document.getElementById('valorTotal').value='';

    carregar();

  }else{

    alert(resultado?.mensagem || 'Erro ao salvar');

  }

  btn.innerHTML = 'SALVAR';
  btn.disabled = false;

}

async function carregar(){

  carregarResumo();

  const resultado = await api('listar');

  const lista = document.getElementById('lista');

  lista.innerHTML='';

  const dados = resultado?.data || resultado || [];

  dados.forEach(item=>{

    let classe='pendente';

    if(item[9]=='PAGO'){
      classe='pago';
    }

    if(item[9]=='ATRASADO'){
      classe='atrasado';
    }

    lista.innerHTML += `
      <tr>

        <td>${item[2]}</td>

        <td>${item[4]}</td>

        <td>${item[5]}/${item[6]}</td>

        <td>
          R$ ${Number(item[7]).toFixed(2)}
        </td>

        <td>
          ${new Date(item[8]).toLocaleDateString('pt-BR')}
        </td>

        <td>
          <span class="status ${classe}">
            ${item[9]}
          </span>
        </td>

        <td>

          ${
            item[9] != 'PAGO'
            ?
            `<button class="btnPago"
              onclick="pagar('${item[0]}')">
              Receber
            </button>`
            :
            '---'
          }

        </td>

      </tr>
    `;

  });

}

async function pagar(id){

  const confirmar = confirm('Confirmar pagamento?');

  if(!confirmar) return;

  const resultado = await api('pagar',{
    id
  });

  if(resultado?.sucesso || resultado?.status=='success'){

    alert('Pagamento registrado');

    carregar();

  }else{

    alert('Erro');

  }

}

async function carregarResumo(){

  const resultado = await api('resumo');

  const r = resultado?.data?.resumo || resultado?.resumo;

  if(!r) return;

  document.getElementById('totalPendente').innerHTML =
    'R$ '+Number(r.totalPendente).toFixed(2);

  document.getElementById('totalPago').innerHTML =
    'R$ '+Number(r.totalPago).toFixed(2);

  document.getElementById('totalAtrasado').innerHTML =
    'R$ '+Number(r.totalAtrasado).toFixed(2);

}

carregar();

</script>

</body>
</html>
