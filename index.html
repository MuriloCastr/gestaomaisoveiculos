<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestão Maiso Veículos</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#f1f5f9;
  padding:20px;
}

.container{
  max-width:1300px;
  margin:auto;
}

.topo{
  background:linear-gradient(135deg,#1e3c72,#2563eb);
  color:white;
  padding:25px;
  border-radius:20px;
  margin-bottom:20px;
}

.topo h1{
  font-size:32px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.card h3{
  color:#666;
  font-size:14px;
  margin-bottom:10px;
}

.card p{
  font-size:28px;
  font-weight:bold;
}

.formulario{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

button{
  border:none;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  font-weight:bold;
}

.btn{
  background:#2563eb;
  color:white;
  width:100%;
  margin-top:15px;
}

.btn:hover{
  opacity:0.9;
}

.busca{
  margin-bottom:20px;
}

.busca input{
  background:white;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  border:none;
  font-size:16px;
}

.grupo{
  background:white;
  border-radius:15px;
  margin-bottom:20px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.grupo-topo{
  background:#1e293b;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  cursor:pointer;
}

.grupo-nome{
  font-size:20px;
  font-weight:bold;
}

.grupo-info{
  font-size:13px;
  opacity:0.9;
  margin-top:5px;
}

.parcelas{
  padding:15px;
  display:none;
}

.parcelas.aberto{
  display:block;
}

.parcela{
  border:1px solid #eee;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:12px;
}

.parcela-topo{
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  cursor:pointer;
}

.parcela-detalhes{
  display:none;
  border-top:1px solid #eee;
  padding:15px;
  background:#fafafa;
}

.parcela-detalhes.aberto{
  display:block;
}

.parcela-esquerda{
  flex:1;
}

.parcela-direita{
  text-align:right;
}

.status{
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pendente{
  background:#fff7ed;
  color:#ea580c;
}

.pago{
  background:#ecfdf5;
  color:#16a34a;
}

.atrasado{
  background:#fef2f2;
  color:#dc2626;
}

.btnPago{
  background:#16a34a;
  color:white;
  padding:10px 14px;
  margin-top:12px;
}

.valor{
  font-size:22px;
  font-weight:bold;
}

.vencimento{
  color:#666;
  font-size:13px;
  margin-top:5px;
}

.resumo-parcela{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.caixa-info{
  background:white;
  border-radius:12px;
  padding:15px;
  border:1px solid #eee;
}

.caixa-info span{
  font-size:12px;
  color:#666;
  display:block;
  margin-bottom:5px;
}

.caixa-info strong{
  font-size:18px;
}

.seta{
  font-size:20px;
}

@media(max-width:700px){

  .topo h1{
    font-size:24px;
  }

}

</style>
</head>
<body>

<div class="container">

  <div class="topo">
    <h1>🚗 Gestão Maiso Veículos</h1>
    <p>Controle Inteligente de Promissórias</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>💰 TOTAL A RECEBER</h3>
      <p id="totalReceber">R$ 0</p>
    </div>

    <div class="card">
      <h3>📅 RECEBER ESTE MÊS</h3>
      <p id="mesReceber">R$ 0</p>
    </div>

    <div class="card">
      <h3>✅ TOTAL RECEBIDO</h3>
      <p id="totalPago">R$ 0</p>
    </div>

    <div class="card">
      <h3>⚠️ ATRASADO</h3>
      <p id="totalAtrasado">R$ 0</p>
    </div>

  </div>

  <div class="busca">
    <input
      type="text"
      id="busca"
      placeholder="🔎 Buscar cliente, descrição ou parcela..."
      onkeyup="carregar()"
    >
  </div>

  <div class="formulario">

    <h2 style="margin-bottom:20px;">Nova Promissória</h2>

    <div class="grid">

      <input type="text" id="nome" placeholder="Cliente">

      <input type="text" id="telefone" placeholder="Telefone">

      <input type="text" id="descricao" placeholder="Descrição">

      <input type="number" id="valorTotal" placeholder="Valor Total">

      <select id="numParcelas">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
        <option value="6">6x</option>
        <option value="12">12x</option>
      </select>

      <input type="date" id="vencimento">

    </div>

    <button class="btn" onclick="salvar(this)">
      SALVAR PROMISSÓRIA
    </button>

  </div>

  <div id="clientes"></div>

</div>

<script>

const API = 'https://script.google.com/macros/s/AKfycbyEw4JNV31NPsKNR8IQAc915VHnwuzKwmjdKo25BXMlBJtAc4-nC8rm7x_sX022kQKb/exec';

async function api(acao,dados={}){

  const response = await fetch(API,{
    method:'POST',
    body:JSON.stringify({
      acao,
      ...dados
    })
  });

  return await response.json();

}

async function salvar(btn){

  const nome = document.getElementById('nome').value;
  const telefone = document.getElementById('telefone').value;
  const descricao = document.getElementById('descricao').value;
  const valorTotal = document.getElementById('valorTotal').value;
  const numParcelas = document.getElementById('numParcelas').value;
  const vencimento = document.getElementById('vencimento').value;

  if(!nome || !valorTotal || !vencimento){
    alert('Preencha os campos obrigatórios');
    return;
  }

  btn.innerHTML='SALVANDO...';
  btn.disabled=true;

  await api('salvar',{
    nome,
    telefone,
    descricao,
    valorTotal,
    numParcelas,
    vencimento
  });

  btn.innerHTML='SALVAR PROMISSÓRIA';
  btn.disabled=false;

  document.getElementById('nome').value='';
  document.getElementById('telefone').value='';
  document.getElementById('descricao').value='';
  document.getElementById('valorTotal').value='';

  carregar();

}

async function carregar(){

  const resultado = await api('listar');

  const dados = resultado.data || resultado;

  const busca = document.getElementById('busca').value.toLowerCase();

  const filtrados = dados.filter(item=>{

    return (
      String(item[2]).toLowerCase().includes(busca) ||
      String(item[4]).toLowerCase().includes(busca) ||
      String(item[5]).includes(busca)
    );

  });

  agruparClientes(filtrados);

  calcularResumo(filtrados);

}

function calcularResumo(lista){

  let totalReceber = 0;
  let totalPago = 0;
  let totalAtrasado = 0;
  let receberMes = 0;

  const hoje = new Date();

  lista.forEach(item=>{

    const valor = Number(item[7]);
    const status = item[9];
    const vencimento = new Date(item[8]);

    if(status == 'PENDENTE'){

      totalReceber += valor;

      if(
        vencimento.getMonth() == hoje.getMonth() &&
        vencimento.getFullYear() == hoje.getFullYear()
      ){
        receberMes += valor;
      }

    }

    if(status == 'PAGO'){
      totalPago += valor;
    }

    if(status == 'ATRASADO'){
      totalAtrasado += valor;
    }

  });

  document.getElementById('totalReceber').innerHTML =
    dinheiro(totalReceber);

  document.getElementById('mesReceber').innerHTML =
    dinheiro(receberMes);

  document.getElementById('totalPago').innerHTML =
    dinheiro(totalPago);

  document.getElementById('totalAtrasado').innerHTML =
    dinheiro(totalAtrasado);

}

function agruparClientes(lista){

  const clientes = {};

  lista.forEach(item=>{

    const nome = item[2];

    if(!clientes[nome]){
      clientes[nome] = [];
    }

    clientes[nome].push(item);

  });

  const container = document.getElementById('clientes');

  container.innerHTML='';

  Object.keys(clientes).forEach((nome,index)=>{

    const parcelas = clientes[nome];

    let totalCliente = 0;

    parcelas.forEach(p=>{

      if(p[9] != 'PAGO'){
        totalCliente += Number(p[7]);
      }

    });

    let html = `
      <div class="grupo">

        <div class="grupo-topo"
          onclick="toggleCliente(${index})">

          <div>

            <div class="grupo-nome">
              👤 ${nome}
            </div>

            <div class="grupo-info">
              ${parcelas.length} parcela(s)
            </div>

          </div>

          <div style="display:flex;align-items:center;gap:15px;">

            <div class="valor">
              ${dinheiro(totalCliente)}
            </div>

            <div class="seta" id="setaCliente${index}">
              ▼
            </div>

          </div>

        </div>

        <div class="parcelas"
          id="cliente${index}">
    `;

    parcelas.forEach((p,i)=>{

      let classe = 'pendente';

      if(p[9] == 'PAGO'){
        classe = 'pago';
      }

      if(p[9] == 'ATRASADO'){
        classe = 'atrasado';
      }

      const valorParcela = Number(p[7]);
      const totalParcelas = Number(p[6]);
      const valorTotal = valorParcela * totalParcelas;

      html += `
        <div class="parcela">

          <div class="parcela-topo"
            onclick="toggleParcela('${index}_${i}')">

            <div class="parcela-esquerda">

              <div>
                <strong>
                  ${p[4] || 'Sem descrição'}
                </strong>
              </div>

              <div class="vencimento">
                Parcela ${p[5]}/${p[6]}
                •
                Vence:
                ${new Date(p[8]).toLocaleDateString('pt-BR')}
              </div>

            </div>

            <div class="parcela-direita">

              <div class="valor">
                ${dinheiro(valorParcela)}
              </div>

              <div style="margin-top:8px;">
                <span class="status ${classe}">
                  ${p[9]}
                </span>
              </div>

            </div>

          </div>

          <div class="parcela-detalhes"
            id="parcela${index}_${i}">

            <div class="resumo-parcela">

              <div class="caixa-info">
                <span>VALOR TOTAL</span>
                <strong>${dinheiro(valorTotal)}</strong>
              </div>

              <div class="caixa-info">
                <span>TOTAL DE PARCELAS</span>
                <strong>${totalParcelas}x</strong>
              </div>

              <div class="caixa-info">
                <span>VALOR DA PARCELA</span>
                <strong>${dinheiro(valorParcela)}</strong>
              </div>

            </div>

            ${
              p[9] != 'PAGO'
              ?
              `
              <button
                class="btnPago"
                onclick="pagar('${p[0]}')">
                RECEBER PARCELA
              </button>
              `
              :
              ''
            }

          </div>

        </div>
      `;

    });

    html += `
        </div>
      </div>
    `;

    container.innerHTML += html;

  });

}

function toggleCliente(id){

  const box = document.getElementById('cliente'+id);
  const seta = document.getElementById('setaCliente'+id);

  box.classList.toggle('aberto');

  seta.innerHTML =
    box.classList.contains('aberto')
    ? '▲'
    : '▼';

}

function toggleParcela(id){

  const box = document.getElementById('parcela'+id);

  box.classList.toggle('aberto');

}

async function pagar(id){

  const ok = confirm('Confirmar recebimento?');

  if(!ok) return;

  await api('pagar',{id});

  carregar();

}

function dinheiro(valor){

  return valor.toLocaleString('pt-BR',{
    style:'currency',
    currency:'BRL'
  });

}

carregar();

</script>

</body>
</html>
